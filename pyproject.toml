[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aoi-drl-scheduler"
version = "0.1.0"
description = "DRL-Based Age-of-Information-Aware Cross-Layer Scheduler for mixed-criticality wireless IoT networks."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kanish Kannan" },
    { name = "Indirajeet Sudharsan" },
    { name = "Rohith S" }
]
dependencies = [
    "numpy~=1.26.0",
    "PyYAML~=6.0",
    "Flask~=3.0",
    "matplotlib~=3.8",
    "scipy~=1.12"
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "pre-commit"
]
train = [
    "torch~=2.2.0",
    "stable-baselines3~=2.3.0",
    "gymnasium>=0.29.0"
]
